[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Disable secrets scanning on public client keys and generated build bundles
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_PROJECT_ID,SUPABASE_PROJECT_ID,VITE_SUPABASE_URL,SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_ANON_KEY,SUPABASE_ANON_KEY"
  SECRETS_SCAN_OMIT_PATHS = "supabase/config.toml,dist/**,.netlify/**"
